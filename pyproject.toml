[project]
name = "telegram-invite-tracker"
version = "1.0.0"
description = "Enterprise-grade Telegram bot for tracking group invitations"
authors = [
    { name = "Bobur Jovliyev", email = "developer@example.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.30.0",
    "sqlalchemy>=2.0.29",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "apscheduler>=4.0.0a2",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "openpyxl>=3.1.2",
    "reportlab>=4.1.0",
    "fluent.runtime>=0.4.0",
    "aiogram-i18n>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "black>=24.3.0",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "factory-boy>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.black]
line-length = 79
target-version = ['py313']
include = '\.pyi?$'

[tool.ruff]
line-length = 79
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["bot"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["src"]
