version: '3.8'

services:
  bot:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: invite_tracker_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override the DB and Redis URLs to point to the docker-compose network
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-invite_tracker}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - LOG_JSON=True
      - BOT_TOKEN=8887391932:AAHSmJjxk9jlMJHTBwbRGRtZgrI92rLs-jU
      - BOT_OWNER_ID=8254782802
    ports:
      - "8080:8080" # Health check endpoint
      - "9090:9090" # Prometheus metrics
    volumes:
      - bot_logs:/app/logs

  db:
    image: postgres:16-alpine
    container_name: invite_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-invite_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-invite_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: invite_tracker_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  bot_logs:
